<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-labelledby="t d"><title id="t">Vier Prüffelder der Amazon-Conversion</title><desc id="d">Suchergebnis beeinflusst den Klick, Detailseite den Warenkorb, Angebot und Bestand den Kauf.</desc><rect width="1000" height="415" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:29px;fill:#fff;font-weight:700}.a{font-size:20px;fill:#fd7765;font-weight:700}.b{font-size:17px;fill:#fff}</style><text x="40" y="49" class="k">TEMOA / CONVERSION-DIAGNOSE</text><text x="40" y="98" class="h">An welcher Stelle verliert die ASIN Käufer?</text><rect x="40" y="136" width="445" height="109" rx="15" fill="#182e4e"/><text x="60" y="177" class="a">SUCHERGEBNIS</text><text x="60" y="213" class="b">Hauptbild, Titel, Preis → Klick</text><rect x="515" y="136" width="445" height="109" rx="15" fill="#182e4e"/><text x="535" y="177" class="a">DETAILSEITE</text><text x="535" y="213" class="b">Maße, Belege, Einwände → Warenkorb</text><rect x="40" y="264" width="445" height="109" rx="15" fill="#182e4e"/><text x="60" y="305" class="a">ANGEBOT</text><text x="60" y="341" class="b">Preis, Featured Offer → Kauf</text><rect x="515" y="264" width="445" height="109" rx="15" fill="#182e4e"/><text x="535" y="305" class="a">BESTAND</text><text x="535" y="341" class="b">Lieferzusage und Verfügbarkeit</text><path d="M40 396H960" stroke="#68dbce" stroke-width="3"/></svg>
