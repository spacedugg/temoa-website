<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Steigende Importkosten: drei Entscheidungsebenen</title><desc id="d">Von Landed Cost über Preis und Promotion bis zu Werbung und Bestand wird der Gesamtbeitrag je SKU geprüft.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · SKU-ÖKONOMIE</text><text x="60" y="123" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Importkosten im Gesamtbeitrag bewerten</text><g font-family="Arial,sans-serif"><rect x="60" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="223" fill="#fd7765" font-size="25" font-weight="bold">Landed Cost</text><text x="84" y="270" fill="white" font-size="21">Einkauf · Fracht · Zoll</text><text x="84" y="310" fill="white" font-size="21">Ursprung · Lieferzeit</text><rect x="435" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="223" fill="#fd7765" font-size="25" font-weight="bold">Markthebel</text><text x="459" y="270" fill="white" font-size="21">Preis · Coupon</text><text x="459" y="310" fill="white" font-size="21">Ads · Bundle</text><rect x="810" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="223" fill="#fd7765" font-size="25" font-weight="bold">Gesamtergebnis</text><text x="834" y="270" fill="white" font-size="21">Absatz · Stückbeitrag</text><text x="834" y="310" fill="white" font-size="21">Bestand · Kapital</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Eine bessere Stückmarge nützt wenig, wenn Volumen und Gesamtbeitrag einbrechen.</text></svg>
