<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Support-Case: Meldung, Nachweis, Entscheidung</title><desc id="d">Ein konkreter Amazon-Support-Fall wird anhand der Meldung, des betroffenen Objekts und der geforderten Entscheidung vorbereitet.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="64" y="75" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · ACCOUNT OPERATIONS</text><text x="64" y="128" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Ein Case, eine Entscheidung</text><g font-family="Arial,sans-serif"><rect x="64" y="175" width="322" height="225" rx="18" fill="#182e4e"/><text x="88" y="225" fill="#fd7765" font-size="26" font-weight="bold">01 · Sachverhalt</text><text x="88" y="272" fill="#fff" font-size="21">ASIN, Land, Meldung</text><text x="88" y="308" fill="#fff" font-size="21">Zeitpunkt, Feed-/Case-ID</text><rect x="439" y="175" width="322" height="225" rx="18" fill="#182e4e"/><text x="463" y="225" fill="#fd7765" font-size="26" font-weight="bold">02 · Beleg</text><text x="463" y="272" fill="#fff" font-size="21">Produkt, Rechnung, Verlauf</text><text x="463" y="308" fill="#fff" font-size="21">Quelle und Version</text><rect x="814" y="175" width="322" height="225" rx="18" fill="#182e4e"/><text x="838" y="225" fill="#fd7765" font-size="26" font-weight="bold">03 · Antrag</text><text x="838" y="272" fill="#fff" font-size="21">Prüfung oder Korrektur</text><text x="838" y="308" fill="#fff" font-size="21">Offene Frage benennen</text></g><text x="64" y="450" fill="#a9c5d8" font-family="Arial,sans-serif" font-size="20">Priorität = wirtschaftliche Wirkung × Dringlichkeit × prüfbare Belege</text></svg>
