<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Kanalübergreifende Bewertung für E-Commerce-Marken</title><desc id="d">Amazon, eigener Shop und B2B werden über Beitragsrechnung, Bestand und gemeinsame Finanzsicht bewertet.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · KANALSTRATEGIE</text><text x="60" y="125" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Ein Sortiment, mehrere Absatzwege</text><g font-family="Arial,sans-serif"><rect x="60" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="222" fill="#fd7765" font-size="25" font-weight="bold">Amazon</text><text x="84" y="269" fill="white" font-size="21">Marketplace-Kosten</text><text x="84" y="309" fill="white" font-size="21">Ads · FBA · Retouren</text><rect x="435" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="222" fill="#fd7765" font-size="25" font-weight="bold">Eigener Shop</text><text x="459" y="269" fill="white" font-size="21">Akquise · Service</text><text x="459" y="309" fill="white" font-size="21">Versand · Wiederkauf</text><rect x="810" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="222" fill="#fd7765" font-size="25" font-weight="bold">Gesamtsicht</text><text x="834" y="269" fill="white" font-size="21">Beitrag · Bestand</text><text x="834" y="309" fill="white" font-size="21">Doppelte Attribution?</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Plattformberichte erklären Kontakte, der Finanzabschluss zählt Verkäufe.</text></svg>
