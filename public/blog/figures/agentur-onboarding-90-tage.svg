<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">90 Tage Agentur-Onboarding</title><desc id="d">Drei Phasen von Diagnose über Fundament bis zur Skalierungsentscheidung, jeweils mit prüfbarem Arbeitsergebnis.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="69" fill="#68dbce" font-family="Arial,sans-serif" font-size="23" font-weight="bold">TEMOA · ZUSAMMENARBEIT</text><text x="60" y="121" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">90 Tage, drei Entscheidungen</text><g font-family="Arial,sans-serif"><rect x="60" y="167" width="330" height="237" rx="18" fill="#182e4e"/><text x="84" y="216" fill="#fd7765" font-size="26" font-weight="bold">01–30 · Diagnose</text><text x="84" y="267" fill="white" font-size="21">SKU-Baseline</text><text x="84" y="306" fill="white" font-size="21">Datenlücken &amp; Risiken</text><text x="84" y="345" fill="#68dbce" font-size="20">→ Prioritätenplan</text><rect x="435" y="167" width="330" height="237" rx="18" fill="#182e4e"/><text x="459" y="216" fill="#fd7765" font-size="26" font-weight="bold">31–60 · Umbau</text><text x="459" y="267" fill="white" font-size="21">Content &amp; Kampagnen</text><text x="459" y="306" fill="white" font-size="21">Änderungen protokolliert</text><text x="459" y="345" fill="#68dbce" font-size="20">→ Saubere Tests</text><rect x="810" y="167" width="330" height="237" rx="18" fill="#182e4e"/><text x="834" y="216" fill="#fd7765" font-size="26" font-weight="bold">61–90 · Bewertung</text><text x="834" y="267" fill="white" font-size="21">Wirkung &amp; Grenzen</text><text x="834" y="306" fill="white" font-size="21">Budget &amp; Bestand</text><text x="834" y="345" fill="#68dbce" font-size="20">→ Quartalsplan</text></g><text x="60" y="451" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Messbar: Was wurde entschieden? Was wurde geändert? Was hat es bewirkt?</text></svg>
