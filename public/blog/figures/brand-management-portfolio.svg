<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Markenmanagement als Portfolioentscheidung</title><desc id="d">Schutz, Katalog, Content und Nachfrage führen zu Investitions-, Reparatur- oder Exit-Entscheidungen je ASIN.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · BRAND MANAGEMENT</text><text x="60" y="125" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Marke steuern heißt Portfolio entscheiden</text><g font-family="Arial,sans-serif"><rect x="60" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="222" fill="#fd7765" font-size="25" font-weight="bold">Schutz &amp; Katalog</text><text x="84" y="269" fill="white" font-size="21">Rechte · Varianten</text><text x="84" y="309" fill="white" font-size="21">Content · Claims</text><rect x="435" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="222" fill="#fd7765" font-size="25" font-weight="bold">Nachfrage &amp; Beitrag</text><text x="459" y="269" fill="white" font-size="21">Brand · Nonbrand</text><text x="459" y="309" fill="white" font-size="21">Marge · Retouren</text><rect x="810" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="222" fill="#fd7765" font-size="25" font-weight="bold">Portfolio</text><text x="834" y="269" fill="white" font-size="21">Investieren · Halten</text><text x="834" y="309" fill="white" font-size="21">Reparieren · Stoppen</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Ein dokumentierter Entscheidungsprozess ist mehr als ein PPC-Report.</text></svg>
