<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Schnittstellen bei Amazon-Agenturmodellen</title><desc id="d">PPC, Content und Operations liefern Signale, ein benannter Owner priorisiert und entscheidet.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · VERANTWORTUNG</text><text x="60" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Wer führt die Übergabe?</text><g font-family="Arial,sans-serif"><rect x="60" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="222" fill="#fd7765" font-size="25" font-weight="bold">Signale</text><text x="84" y="270" fill="white" font-size="21">PPC · Content</text><text x="84" y="309" fill="white" font-size="21">Bestand · Marge</text><rect x="435" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="222" fill="#fd7765" font-size="25" font-weight="bold">Owner</text><text x="459" y="270" fill="white" font-size="21">Priorität · Freigabe</text><text x="459" y="309" fill="white" font-size="21">Termin · Dokumentation</text><rect x="810" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="222" fill="#fd7765" font-size="25" font-weight="bold">Ergebnis</text><text x="834" y="270" fill="white" font-size="21">SKU-Maßnahme</text><text x="834" y="309" fill="white" font-size="21">Messung &amp; Folgeaktion</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Full Service oder Spezialisten: Die Schnittstelle muss jemand besitzen.</text></svg>
