<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Käufernachricht als Service- und Produktsignal</title><desc id="d">Eine Nachricht wird bestellbezogen beantwortet und ihre Ursache bei Produkt, Verpackung oder Listing geprüft.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="68" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · KÄUFERSERVICE</text><text x="60" y="122" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Ein Fall. Zwei Aufgaben.</text><g font-family="Arial,sans-serif"><rect x="60" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="221" fill="#fd7765" font-size="25" font-weight="bold">Nachricht</text><text x="84" y="269" fill="white" font-size="21">ASIN · Bestellung</text><text x="84" y="307" fill="white" font-size="21">Konkretes Problem</text><rect x="435" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="221" fill="#fd7765" font-size="25" font-weight="bold">Service</text><text x="459" y="269" fill="white" font-size="21">Richtige Lösung</text><text x="459" y="307" fill="white" font-size="21">Ohne Bewertungsdruck</text><rect x="810" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="221" fill="#fd7765" font-size="25" font-weight="bold">Produkt</text><text x="834" y="269" fill="white" font-size="21">Ursache · Charge</text><text x="834" y="307" fill="white" font-size="21">Listing-Korrektur</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Wiederkehrende Servicefälle sind ein Qualitäts- und Content-Signal.</text></svg>
