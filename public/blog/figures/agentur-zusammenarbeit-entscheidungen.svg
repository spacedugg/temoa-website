<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Marke und Agentur: Input, Entscheidung, Wirkung</title><desc id="d">Marge und Bestand der Marke führen zu Geboten, Content- und Sortimentsentscheidungen der Agentur, die anhand des Gesamtbeitrags bewertet werden.</desc><rect width="1200" height="520" rx="32" fill="#0b1930"/><text x="60" y="72" fill="#68dbce" font-family="Arial,sans-serif" font-size="23" font-weight="bold">TEMOA · PARTNERSCHAFT</text><text x="60" y="127" fill="white" font-family="Arial,sans-serif" font-size="35" font-weight="bold">Daten teilen. Entscheidungen treffen. Wirkung prüfen.</text><g font-family="Arial,sans-serif"><rect x="60" y="175" width="330" height="250" rx="18" fill="#182e4e"/><text x="84" y="225" fill="#fd7765" font-size="26" font-weight="bold">Marke</text><text x="84" y="274" fill="white" font-size="21">Marge · Bestand</text><text x="84" y="311" fill="white" font-size="21">Ziel · Preisrahmen</text><text x="84" y="348" fill="white" font-size="21">Produktbelege</text><rect x="435" y="175" width="330" height="250" rx="18" fill="#182e4e"/><text x="459" y="225" fill="#fd7765" font-size="26" font-weight="bold">Agentur</text><text x="459" y="274" fill="white" font-size="21">Query · Gebot</text><text x="459" y="311" fill="white" font-size="21">Content · Test</text><text x="459" y="348" fill="white" font-size="21">Empfehlung &amp; Umsetzung</text><rect x="810" y="175" width="330" height="250" rx="18" fill="#182e4e"/><text x="834" y="225" fill="#fd7765" font-size="26" font-weight="bold">Gemeinsame Prüfung</text><text x="834" y="274" fill="white" font-size="21">Beitrag · Nachfrage</text><text x="834" y="311" fill="white" font-size="21">Retouren · Bestand</text><text x="834" y="348" fill="#68dbce" font-size="21">Nächste Entscheidung</text></g><text x="60" y="472" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Ein Owner und ein Termin für jede offene Entscheidung</text></svg>
