<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="t d"><title id="t">Von Käuferfrage zu belegtem Produktdatum</title><desc id="d">Eine konkrete Frage wird mit einer Variantenangabe, einem Beleg und konsistentem Listing-Content beantwortet.</desc><rect width="1200" height="510" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · PRODUKT-DISCOVERY</text><text x="60" y="125" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Kann das Listing die Frage belegen?</text><g font-family="Arial,sans-serif"><rect x="60" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="84" y="223" fill="#fd7765" font-size="25" font-weight="bold">Käuferfrage</text><text x="84" y="274" fill="white" font-size="21">„Passt sie in den</text><text x="84" y="307" fill="white" font-size="21">Getränkehalter?“</text><rect x="435" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="459" y="223" fill="#fd7765" font-size="25" font-weight="bold">Produktbeleg</text><text x="459" y="274" fill="white" font-size="21">Außendurchmesser</text><text x="459" y="307" fill="white" font-size="21">je Variante</text><rect x="810" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="834" y="223" fill="#fd7765" font-size="25" font-weight="bold">Listing</text><text x="834" y="274" fill="white" font-size="21">Attribut · Maßbild</text><text x="834" y="307" fill="white" font-size="21">klare Einschränkung</text></g><text x="60" y="462" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Antworten testen · Fehlzuordnungen dokumentieren · Conversion und Retouren prüfen</text></svg>
