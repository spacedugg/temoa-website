<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Freigabeprüfung vor dem Einkauf</title><desc id="d">Vier Prüfbereiche: Marke, ASIN, Produktnachweis und konsistente Dokumente, bevor ein Sortiment verbindlich bestellt wird.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="62" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · COMPLIANCE</text><text x="62" y="122" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Erst die Freigabe, dann der Wareneinkauf</text><g font-family="Arial,sans-serif"><rect x="62" y="171" width="247" height="225" rx="17" fill="#182e4e"/><text x="83" y="222" fill="#fd7765" font-size="25" font-weight="bold">01 · Marke</text><text x="83" y="269" fill="white" font-size="20">Bezugsquelle</text><text x="83" y="305" fill="white" font-size="20">Berechtigung</text><rect x="337" y="171" width="247" height="225" rx="17" fill="#182e4e"/><text x="358" y="222" fill="#fd7765" font-size="25" font-weight="bold">02 · ASIN</text><text x="358" y="269" fill="white" font-size="20">Kategorie</text><text x="358" y="305" fill="white" font-size="20">Zielmarkt</text><rect x="612" y="171" width="247" height="225" rx="17" fill="#182e4e"/><text x="633" y="222" fill="#fd7765" font-size="25" font-weight="bold">03 · Produkt</text><text x="633" y="269" fill="white" font-size="20">Modell &amp; Variante</text><text x="633" y="305" fill="white" font-size="20">Nachweise</text><rect x="887" y="171" width="247" height="225" rx="17" fill="#182e4e"/><text x="908" y="222" fill="#fd7765" font-size="25" font-weight="bold">04 · Antrag</text><text x="908" y="269" fill="white" font-size="20">Dokumente</text><text x="908" y="305" fill="white" font-size="20">Status &amp; Owner</text></g><text x="62" y="447" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Pro ASIN und Marktplatz dokumentieren · Freigabe ist keine Pauschalzusage</text></svg>
