<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="t d"><title id="t">Kaufweg durch den Amazon Brand Store</title><desc id="d">Sponsored-Brands-Suche führt auf passende Kategorie-Seite, dort beantworten Module die Kaufentscheidung und führen zum verfügbaren Produkt.</desc><rect width="1200" height="510" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · STORE DESIGN</text><text x="60" y="125" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Der Weg muss zur Suchabsicht passen</text><g font-family="Arial,sans-serif"><rect x="60" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="84" y="223" fill="#fd7765" font-size="25" font-weight="bold">Suchanfrage</text><text x="84" y="274" fill="white" font-size="21">„Espresso Bohnen“</text><text x="84" y="316" fill="#68dbce" font-size="20">Sponsored Brands</text><rect x="435" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="459" y="223" fill="#fd7765" font-size="25" font-weight="bold">Store-Unterseite</text><text x="459" y="274" fill="white" font-size="21">Röstgrad · Format</text><text x="459" y="316" fill="#68dbce" font-size="20">Mobil sofort sichtbar</text><rect x="810" y="170" width="330" height="248" rx="18" fill="#182e4e"/><text x="834" y="223" fill="#fd7765" font-size="25" font-weight="bold">Produktangebot</text><text x="834" y="274" fill="white" font-size="21">Verfügbar · passender Preis</text><text x="834" y="316" fill="#68dbce" font-size="20">Kaufentscheidung</text></g><text x="60" y="462" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Je Traffic-Quelle messen: Seitenaufruf → Produktklick → zugeordneter Verkauf</text></svg>
