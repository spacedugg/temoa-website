<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Sichere Automatisierungsregel für Amazon</title><desc id="d">Eine Regel prüft Daten und Auslöser, begrenzt die Aktion und hält bei fehlendem Bestand oder unsicheren Eingaben an.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · AUTOMATISIERUNG</text><text x="60" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Jede Regel braucht eine Rückfallregel</text><g font-family="Arial,sans-serif"><rect x="60" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="223" fill="#fd7765" font-size="25" font-weight="bold">Auslöser</text><text x="84" y="270" fill="white" font-size="21">Genügend Daten?</text><text x="84" y="310" fill="white" font-size="21">Attribution vollständig?</text><rect x="435" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="223" fill="#fd7765" font-size="25" font-weight="bold">Grenze</text><text x="459" y="270" fill="white" font-size="21">Budget · Preis · Bestand</text><text x="459" y="310" fill="white" font-size="21">Maximale Änderung</text><rect x="810" y="170" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="223" fill="#fd7765" font-size="25" font-weight="bold">Kontrolle</text><text x="834" y="270" fill="white" font-size="21">Protokoll · Owner</text><text x="834" y="310" fill="#68dbce" font-size="21">Stopp bei Abweichung</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Vom Vorschlag zum begrenzten Live-Test, erst dann zum Regelbetrieb.</text></svg>
