<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-labelledby="t d"><title id="t">Prüfablauf vor der Skalierung einer Amazon-Kategorie</title><desc id="d">Erst passende Kategoriepfade sammeln, dann Produktdaten prüfen, Suchkontakte auswerten und erst bei bestätigter Relevanz skalieren.</desc><rect width="1000" height="415" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:29px;fill:#fff;font-weight:700}.a{font-size:20px;fill:#fd7765;font-weight:700}.b{font-size:17px;fill:#fff}</style><text x="40" y="49" class="k">TEMOA / VOR DEM LAUNCH</text><text x="40" y="98" class="h">Kategorie-Fit prüfen, dann Budget erhöhen</text><rect x="40" y="136" width="445" height="109" rx="15" fill="#182e4e"/><text x="60" y="177" class="a">01 · NODES KARTIEREN</text><text x="60" y="213" class="b">Vergleichbare ASINs und Nachfrage</text><rect x="515" y="136" width="445" height="109" rx="15" fill="#182e4e"/><text x="535" y="177" class="a">02 · DATEN ABGLEICHEN</text><text x="535" y="213" class="b">Produkttyp und relevante Attribute</text><rect x="40" y="264" width="445" height="109" rx="15" fill="#182e4e"/><text x="60" y="305" class="a">03 · SUCHKONTAKTE TESTEN</text><text x="60" y="341" class="b">Suchbegriffe und Produktziele</text><rect x="515" y="264" width="445" height="109" rx="15" fill="#182e4e"/><text x="535" y="305" class="a">04 · LAUNCH SKALIEREN</text><text x="535" y="341" class="b">Nur bei belegter Produktpassung</text><path d="M40 396H960" stroke="#68dbce" stroke-width="3"/></svg>
