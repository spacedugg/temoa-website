<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Amazon Launch: Entscheidungen bis Tag 60</title><desc id="d">Vor Start Produkt und Bestand freigeben, bis Tag 30 passende Suchanfragen herausarbeiten und bis Tag 60 über Skalierung entscheiden.</desc><rect width="1000" height="380" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:29px;fill:#fff;font-weight:700}.n{font-size:19px;fill:#fd7765;font-weight:700}.v{font-size:18px;fill:#fff}</style><text x="40" y="50" class="k">TEMOA / LAUNCH-PLAN</text><text x="40" y="99" class="h">Jede Phase braucht eine Freigabe</text><rect x="40" y="137" width="286" height="199" rx="16" fill="#182e4e"/><text x="59" y="177" class="n">VOR START</text><text x="59" y="219" class="v">Produktdaten und Bestand</text><text x="59" y="254" class="v">Content und Suchbegriffe</text><rect x="357" y="137" width="286" height="199" rx="16" fill="#182e4e"/><text x="376" y="177" class="n">TAG 1–30</text><text x="376" y="219" class="v">Passende Queries ernten</text><text x="376" y="254" class="v">Kaufhürden beheben</text><rect x="674" y="137" width="286" height="199" rx="16" fill="#182e4e"/><text x="693" y="177" class="n">TAG 31–60</text><text x="693" y="219" class="v">Bestand und Beitrag prüfen</text><text x="693" y="254" class="v">Skalieren oder pausieren</text><path d="M40 359H960" stroke="#68dbce" stroke-width="3"/></svg>
