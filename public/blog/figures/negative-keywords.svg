<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Entscheidung über negative Amazon-Suchbegriffe</title><desc id="d">Suchanfrage anhand von Produktfit, Datenmenge und Conversion prüfen, bevor sie als Negative Exact oder Phrase ausgeschlossen wird.</desc><rect width="1000" height="390" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:31px;fill:#fff;font-weight:700}.a{font-size:20px;fill:#fd7765;font-weight:700}.b{font-size:17px;fill:#fff}</style><text x="40" y="48" class="k">TEMOA / SUCHBEGRIFFSBERICHT</text><text x="40" y="98" class="h">Relevanz zuerst, dann Ausschlussart</text><rect x="40" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="60" y="182" class="a">PRODUKTFIT</text><text x="60" y="223" class="b">Erfüllt die ASIN wirklich</text><text x="60" y="254" class="b">die Suchabsicht?</text><rect x="355" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="375" y="182" class="a">EVIDENZ</text><text x="375" y="223" class="b">Klicks, Käufe und Kosten</text><text x="375" y="254" class="b">pro Suchanfrage</text><rect x="670" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="690" y="182" class="a">EINGRIFF</text><text x="690" y="223" class="b">Exact, Phrase oder</text><text x="690" y="254" class="b">Gebot / Listing prüfen</text><path d="M40 363H960" stroke="#68dbce" stroke-width="3"/></svg>
