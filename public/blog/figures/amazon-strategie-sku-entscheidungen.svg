<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Vier Portfolioentscheidungen für Amazon-SKUs</title><desc id="d">Investieren, Conversion reparieren, Verfügbarkeit sichern oder Kosten begrenzen je nach Produkt- und Nachfragesignal.</desc><rect width="1200" height="520" rx="32" fill="#0b1930"/><text x="58" y="68" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · PORTFOLIO</text><text x="58" y="118" fill="white" font-family="Arial,sans-serif" font-size="35" font-weight="bold">Jede ASIN braucht eine andere Aufgabe</text><g font-family="Arial,sans-serif"><rect x="58" y="161" width="525" height="135" rx="18" fill="#182e4e"/><text x="84" y="212" fill="#fd7765" font-size="27" font-weight="bold">Investieren</text><text x="84" y="256" fill="white" font-size="21">Beitrag und Nachfrage tragen Wachstum</text><rect x="617" y="161" width="525" height="135" rx="18" fill="#182e4e"/><text x="643" y="212" fill="#fd7765" font-size="27" font-weight="bold">Conversion reparieren</text><text x="643" y="256" fill="white" font-size="21">Klicks vorhanden, Kaufquote zu schwach</text><rect x="58" y="317" width="525" height="135" rx="18" fill="#182e4e"/><text x="84" y="368" fill="#fd7765" font-size="27" font-weight="bold">Verfügbarkeit sichern</text><text x="84" y="412" fill="white" font-size="21">Nachfrage größer als lieferbarer Bestand</text><rect x="617" y="317" width="525" height="135" rx="18" fill="#182e4e"/><text x="643" y="368" fill="#fd7765" font-size="27" font-weight="bold">Kosten begrenzen</text><text x="643" y="412" fill="white" font-size="21">Absatz vorhanden, Beitrag unter Ziel</text></g></svg>
