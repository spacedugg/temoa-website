<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Rezensionen nach Ursache bearbeiten</title><desc id="d">Richtlinienverstoß melden, Servicefrage bestellbezogen lösen und Produktkritik als Qualitätsdaten behandeln.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="69" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · REVIEW TRIAGE</text><text x="60" y="123" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Nicht jede Kritik ist ein Löschfall</text><g font-family="Arial,sans-serif"><rect x="60" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="221" fill="#fd7765" font-size="25" font-weight="bold">Richtlinie</text><text x="84" y="269" fill="white" font-size="21">Konkreter Verstoß?</text><text x="84" y="307" fill="white" font-size="21">Belegbar melden</text><rect x="435" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="221" fill="#fd7765" font-size="25" font-weight="bold">Service</text><text x="459" y="269" fill="white" font-size="21">Bestellung betroffen?</text><text x="459" y="307" fill="white" font-size="21">Zulässiger Lösungsweg</text><rect x="810" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="221" fill="#fd7765" font-size="25" font-weight="bold">Produkt</text><text x="834" y="269" fill="white" font-size="21">Variante · Charge</text><text x="834" y="307" fill="white" font-size="21">Qualität · Content</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Die Plattformentscheidung über eine Meldung ist nicht garantiert.</text></svg>
