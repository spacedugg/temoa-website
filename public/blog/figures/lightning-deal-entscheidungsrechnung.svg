<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Blitzangebot mit Gegenfall bewerten</title><desc id="d">Baseline ohne Deal, Deckungsbeitrag und Kosten während der Aktion sowie Nachfrage und Bestand nach dem Deal werden verglichen.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · PROMOTION</text><text x="60" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Mehr Verkäufe sind nicht automatisch mehr Beitrag</text><g font-family="Arial,sans-serif"><rect x="60" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="222" fill="#fd7765" font-size="25" font-weight="bold">Ohne Deal</text><text x="84" y="270" fill="white" font-size="21">Normalabsatz</text><text x="84" y="309" fill="white" font-size="21">Beitrag · Lagerkosten</text><rect x="435" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="222" fill="#fd7765" font-size="25" font-weight="bold">Während des Deals</text><text x="459" y="270" fill="white" font-size="21">Rabatt · Gebühr</text><text x="459" y="309" fill="white" font-size="21">Ads · Bestand</text><rect x="810" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="222" fill="#fd7765" font-size="25" font-weight="bold">Danach</text><text x="834" y="270" fill="white" font-size="21">Nachfrage · Retouren</text><text x="834" y="309" fill="white" font-size="21">Wiederbeschaffung</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Den Gegenfall vor der Aktion festlegen, nicht im Nachhinein erfinden.</text></svg>
