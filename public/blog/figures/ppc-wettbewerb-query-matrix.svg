<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Wettbewerbsdaten in einen Amazon-PPC-Test übersetzen</title><desc id="d">Query-Beobachtung, eigenes Angebots- und Werbesignal sowie begrenzter Test ergeben eine Entscheidung.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · PPC INTELLIGENCE</text><text x="60" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Vom Wettbewerbersignal zum Test</text><g font-family="Arial,sans-serif"><rect x="60" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="221" fill="#fd7765" font-size="25" font-weight="bold">Query &amp; Angebot</text><text x="84" y="269" fill="white" font-size="21">Preis · Bild · Bewertung</text><text x="84" y="308" fill="white" font-size="21">Mehrere Stichproben</text><rect x="435" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="221" fill="#fd7765" font-size="25" font-weight="bold">Eigene Daten</text><text x="459" y="269" fill="white" font-size="21">CTR · CPC · CVR</text><text x="459" y="308" fill="white" font-size="21">Placement · Beitrag</text><rect x="810" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="221" fill="#fd7765" font-size="25" font-weight="bold">Begrenzter Test</text><text x="834" y="269" fill="white" font-size="21">Ein Hebel · Laufzeit</text><text x="834" y="308" fill="white" font-size="21">Stop-Kriterium</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Fremde Budgets bleiben unbekannt. Die eigene Wirkung ist messbar.</text></svg>
