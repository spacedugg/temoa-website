<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Von der Amazon-Query zum Gesamtbeitrag</title><desc id="d">Sichtbarkeit, Klick und Kauf führen erst nach Kosten und Bestand zu einer sinnvollen Wachstumsentscheidung.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="69" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · ENTSCHEIDUNGSKETTE</text><text x="60" y="123" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Wo verliert die SKU Wachstum?</text><g font-family="Arial,sans-serif"><rect x="60" y="170" width="246" height="235" rx="18" fill="#182e4e"/><text x="82" y="221" fill="#fd7765" font-size="24" font-weight="bold">Query</text><text x="82" y="265" fill="white" font-size="19">Sichtbarkeit</text><text x="82" y="301" fill="white" font-size="19">Suchanteil</text><rect x="338" y="170" width="246" height="235" rx="18" fill="#182e4e"/><text x="360" y="221" fill="#fd7765" font-size="24" font-weight="bold">Klick</text><text x="360" y="265" fill="white" font-size="19">Bild · Preis</text><text x="360" y="301" fill="white" font-size="19">Featured Offer</text><rect x="616" y="170" width="246" height="235" rx="18" fill="#182e4e"/><text x="638" y="221" fill="#fd7765" font-size="24" font-weight="bold">Kauf</text><text x="638" y="265" fill="white" font-size="19">Content · Variante</text><text x="638" y="301" fill="white" font-size="19">Retouren</text><rect x="894" y="170" width="246" height="235" rx="18" fill="#182e4e"/><text x="916" y="221" fill="#fd7765" font-size="24" font-weight="bold">Beitrag</text><text x="916" y="265" fill="white" font-size="19">Kosten · Werbung</text><text x="916" y="301" fill="white" font-size="19">Bestand</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Erst der Engpass, dann das Budget.</text></svg>
