<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">PPC-Agenturen an einem Fall vergleichen</title><desc id="d">Gleiche SKU-Daten an Anbieter geben und Diagnose, Test und wirtschaftliche Bewertung vergleichen.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · AGENTURWAHL</text><text x="60" y="125" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Ein Kontofall. Vergleichbare Antworten.</text><g font-family="Arial,sans-serif"><rect x="60" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="222" fill="#fd7765" font-size="25" font-weight="bold">Gleicher Input</text><text x="84" y="270" fill="white" font-size="21">CPC ↑ · CVR ↓</text><text x="84" y="309" fill="white" font-size="21">Marge · Bestand</text><rect x="435" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="222" fill="#fd7765" font-size="25" font-weight="bold">Agenturdiagnose</text><text x="459" y="270" fill="white" font-size="21">Query · Placement</text><text x="459" y="309" fill="white" font-size="21">Angebot · Messfehler</text><rect x="810" y="171" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="222" fill="#fd7765" font-size="25" font-weight="bold">30-Tage-Output</text><text x="834" y="270" fill="white" font-size="21">Test · Stop-Kriterium</text><text x="834" y="309" fill="white" font-size="21">Beitrag · Protokoll</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Methode und Verantwortliche zählen mehr als ein garantiertes ACoS-Ziel.</text></svg>
