<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="t d"><title id="t">Negative Keywords: Ebene und Match Type wählen</title><desc id="d">Zuerst prüfen, ob die Anfrage für alle Produkte oder nur eine Variante falsch ist; danach Negative Exact oder Phrase nach Reichweite wählen.</desc><rect width="1000" height="410" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:29px;fill:#fff;font-weight:700}.a{font-size:21px;fill:#fd7765;font-weight:700}.b{font-size:18px;fill:#fff}.s{font-size:16px;fill:#d4e2ed}</style><text x="40" y="49" class="k">TEMOA / NEGATIVE KEYWORDS</text><text x="40" y="98" class="h">Erst Geltungsbereich, dann Match Type</text><rect x="40" y="135" width="440" height="221" rx="16" fill="#182e4e"/><text x="61" y="178" class="a">01 · Wo ist die Anfrage falsch?</text><text x="61" y="222" class="b">Für alle ASINs: Kampagne</text><text x="61" y="254" class="b">Nur eine Variante: Anzeigengruppe</text><text x="61" y="311" class="s">Passende Schwester-ASIN erhalten</text><rect x="520" y="135" width="440" height="221" rx="16" fill="#182e4e"/><text x="541" y="178" class="a">02 · Was soll gesperrt werden?</text><text x="541" y="222" class="b">Eine Query: Negative Exact</text><text x="541" y="254" class="b">Ganzes Muster: Negative Phrase</text><text x="541" y="311" class="s">Wertvolle Long-Tail-Suchen prüfen</text><path d="M40 389H960" stroke="#68dbce" stroke-width="3"/></svg>
