<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Datenraum für den Verkauf einer Amazon-Marke</title><desc id="d">Der Ertrag wird durch SKU- und Kanalrisiko, Markenrechte, Operations und Account Health auf Übertragbarkeit geprüft.</desc><rect width="1200" height="520" rx="32" fill="#0b1930"/><text x="60" y="69" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · EXIT READINESS</text><text x="60" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Ist der Ertrag übertragbar?</text><g font-family="Arial,sans-serif"><rect x="60" y="168" width="330" height="250" rx="18" fill="#182e4e"/><text x="84" y="221" fill="#fd7765" font-size="25" font-weight="bold">Ergebnisbasis</text><text x="84" y="267" fill="white" font-size="21">SKU-Beitrag</text><text x="84" y="305" fill="white" font-size="21">Bereinigungen</text><text x="84" y="343" fill="white" font-size="21">Working Capital</text><rect x="435" y="168" width="330" height="250" rx="18" fill="#182e4e"/><text x="459" y="221" fill="#fd7765" font-size="25" font-weight="bold">Nachfrage</text><text x="459" y="267" fill="white" font-size="21">SKU- und Kanalmix</text><text x="459" y="305" fill="white" font-size="21">Brand Queries</text><text x="459" y="343" fill="white" font-size="21">Wiederkäufe</text><rect x="810" y="168" width="330" height="250" rx="18" fill="#182e4e"/><text x="834" y="221" fill="#fd7765" font-size="25" font-weight="bold">Übertragbarkeit</text><text x="834" y="267" fill="white" font-size="21">Lieferverträge</text><text x="834" y="305" fill="white" font-size="21">Marke &amp; Account</text><text x="834" y="343" fill="white" font-size="21">Prozesse &amp; Team</text></g><text x="60" y="466" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Ein Multiple ersetzt keinen belegten, nachhaltigen Cashflow.</text></svg>
