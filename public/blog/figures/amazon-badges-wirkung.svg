<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Amazon-Badge und tatsächliche Wirkung</title><desc id="d">Badge beobachten, gleichzeitige Änderungen kontrollieren, Beitrag nach Aktion bewerten.</desc><rect width="1200" height="500" rx="32" fill="#0b1930"/><text x="60" y="68" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · SUCHERGEBNIS</text><text x="60" y="122" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Badge sehen. Wirkung prüfen.</text><g font-family="Arial,sans-serif"><rect x="60" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="84" y="221" fill="#fd7765" font-size="25" font-weight="bold">Beobachtung</text><text x="84" y="269" fill="white" font-size="21">ASIN · Query · Markt</text><text x="84" y="307" fill="white" font-size="21">Zeitpunkt · Badge</text><rect x="435" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="459" y="221" fill="#fd7765" font-size="25" font-weight="bold">Kontrolle</text><text x="459" y="269" fill="white" font-size="21">Preis · Bild · Bestand</text><text x="459" y="307" fill="white" font-size="21">Anzeigenmix</text><rect x="810" y="169" width="330" height="240" rx="18" fill="#182e4e"/><text x="834" y="221" fill="#fd7765" font-size="25" font-weight="bold">Bewertung</text><text x="834" y="269" fill="white" font-size="21">CTR · Kaufquote</text><text x="834" y="307" fill="white" font-size="21">Gesamtbeitrag</text></g><text x="60" y="452" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Keine Aktion allein auf einen temporären Badge kalkulieren.</text></svg>
