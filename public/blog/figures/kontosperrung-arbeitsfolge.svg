<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="t d"><title id="t">Arbeitsfolge bei Kontosperrung</title><desc id="d">Aus der konkreten Meldung werden betroffene Objekte, Belege und der geforderte Antwortweg abgeleitet.</desc><rect width="1200" height="490" rx="32" fill="#0b1930"/><text x="62" y="70" fill="#68dbce" font-family="Arial,sans-serif" font-size="22" font-weight="bold">TEMOA · ACCOUNT HEALTH</text><text x="62" y="124" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Erst der Befund, dann der Einspruch</text><g font-family="Arial,sans-serif"><rect x="62" y="171" width="322" height="226" rx="18" fill="#182e4e"/><text x="88" y="224" fill="#fd7765" font-size="27" font-weight="bold">01 · Meldung</text><text x="88" y="268" fill="white" font-size="21">Wortlaut · Frist</text><text x="88" y="306" fill="white" font-size="21">ASIN oder ganzes Konto?</text><rect x="439" y="171" width="322" height="226" rx="18" fill="#182e4e"/><text x="465" y="224" fill="#fd7765" font-size="27" font-weight="bold">02 · Beleg</text><text x="465" y="268" fill="white" font-size="21">Rechnung · Variante</text><text x="465" y="306" fill="white" font-size="21">Bestellung · Ursache</text><rect x="816" y="171" width="322" height="226" rx="18" fill="#182e4e"/><text x="842" y="224" fill="#fd7765" font-size="27" font-weight="bold">03 · Antwort</text><text x="842" y="268" fill="white" font-size="21">Nachweis, POA oder</text><text x="842" y="306" fill="white" font-size="21">begründeter Widerspruch</text></g><text x="62" y="444" fill="#aac5d9" font-family="Arial,sans-serif" font-size="20">Keine erfundene Ursache. Jeder Beleg muss zur betroffenen Ware passen.</text></svg>
