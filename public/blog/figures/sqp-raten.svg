<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
<title id="t">SQP-Raten richtig vergleichen</title><desc id="d">Dashboard-Raten verwenden Suchvolumen als Nenner. Eine eigene Klick-zu-Warenkorb-Quote teilt Warenkorbzugänge durch Klicks.</desc>
<rect width="1000" height="390" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:32px;fill:#fff;font-weight:700}.label{font-size:20px;fill:#fff;font-weight:700}.body{font-size:18px;fill:#d5e1ed}.accent{font-size:24px;fill:#fd7765;font-weight:700}</style>
<text x="42" y="51" class="k">TEMOA / DATEN RICHTIG LESEN</text><text x="42" y="101" class="h">Gleiche Stufe, anderer Nenner</text>
<rect x="42" y="133" width="440" height="211" rx="17" fill="#182e4e"/><text x="65" y="173" class="label">SQP-Dashboard-Rate</text><text x="65" y="214" class="accent">Warenkorbzugänge ÷ Suchvolumen</text><text x="65" y="259" class="body">Das ist keine Klick-zu-Warenkorb-</text><text x="65" y="289" class="body">Conversion.</text>
<rect x="518" y="133" width="440" height="211" rx="17" fill="#182e4e"/><text x="541" y="173" class="label">Eigene Stufenquote</text><text x="541" y="214" class="accent">Warenkorbzugänge ÷ Klicks</text><text x="541" y="259" class="body">Nur Werte derselben Query und</text><text x="541" y="289" class="body">desselben Zeitraums verwenden.</text>
<path d="M42 367H958" stroke="#68dbce" stroke-width="3"/>
