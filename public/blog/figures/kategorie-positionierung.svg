<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Drei Ebenen der Amazon-Kategoriepositionierung</title><desc id="d">Browse Node, Produkttyp und relevante Attribute beschreiben denselben Produkttyp.</desc><rect width="1000" height="390" rx="24" fill="#0b1930"/><style>text{font-family:Arial,Helvetica,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#68dbce;font-weight:700}.h{font-size:31px;fill:#fff;font-weight:700}.a{font-size:21px;fill:#fd7765;font-weight:700}.b{font-size:17px;fill:#fff}</style><text x="40" y="48" class="k">TEMOA / KATEGORIEPOSITIONIERUNG</text><text x="40" y="98" class="h">Drei Signale, eine Produktfunktion</text><rect x="40" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="60" y="182" class="a">BROWSE NODE</text><text x="60" y="223" class="b">Sichtbarer Kategoriepfad</text><text x="60" y="254" class="b">und Vergleichsgruppe</text><rect x="355" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="375" y="182" class="a">PRODUKTTYP</text><text x="375" y="223" class="b">Passendes Datenschema</text><text x="375" y="254" class="b">für die ASIN</text><rect x="670" y="140" width="290" height="195" rx="15" fill="#182e4e"/><text x="690" y="182" class="a">ATTRIBUTE</text><text x="690" y="223" class="b">Material, Funktion, Filter</text><text x="690" y="254" class="b">sachlich korrekt ausfüllen</text><path d="M40 363H960" stroke="#68dbce" stroke-width="3"/></svg>
